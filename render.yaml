services:
  - type: web
    name: climate-hazard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STORE_PREFERENCE
        value: auto
      - key: TRUST_PROXY
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: climate_hazard
      - key: CORS_ORIGINS
        sync: false
